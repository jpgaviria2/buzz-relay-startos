name: Build support admission package

on:
  push:
    branches: [feat/support-admission]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: support-admission-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Set up package build environment
        uses: Start9Labs/start-technologies/.github/actions/setup-build-env@master

      - name: Check out package
        uses: actions/checkout@v6

      - name: Check out hardened Buzz relay
        uses: actions/checkout@v6
        with:
          repository: jpgaviria2/buzz
          ref: fa2378844b67b5e899f036d9b6a5a03c061955f1
          path: buzz-source

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the support-capable relay image locally
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target runtime \
            --push \
            --tag ghcr.io/jpgaviria2/buzz-relay-support:sha-fa23788 \
            --build-arg BUZZ_SOURCE_SHA=fa2378844b67b5e899f036d9b6a5a03c061955f1 \
            --build-arg BUZZ_BUILD_ID=github-actions:${{ github.run_id }}:${{ github.run_attempt }} \
            --build-arg BUZZ_BUILD_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            --cache-from type=gha,scope=support-relay-amd64 \
            --cache-to type=gha,scope=support-relay-amd64,mode=max \
            buzz-source

      - name: Create package signing key
        run: |
          start-cli init-key
          mkdir -p .startos
          cp ~/.startos/id.key.pem .startos/build.key.pem

      - name: Install package dependencies
        run: npm ci

      - name: Build x86 package
        uses: Start9Labs/start-technologies/.github/actions/build-s9pk@master
        with:
          target: x86

      - name: Upload package artifact
        uses: Start9Labs/start-technologies/.github/actions/upload-each@master
        with:
          pattern: '*.s9pk'
          retention-days: 14
          compression-level: 0
