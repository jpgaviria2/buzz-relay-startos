name: Build clean upstream rollback package

on:
  push:
    branches: [rollback/latest-upstream]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rollback-upstream-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Set up package build environment
        uses: Start9Labs/start-technologies/.github/actions/setup-build-env@master

      - name: Check out package
        uses: actions/checkout@v6

      - name: Create package signing key
        run: |
          start-cli init-key
          mkdir -p .startos
          cp ~/.startos/id.key.pem .startos/build.key.pem

      - name: Install package dependencies
        run: npm ci

      - name: Build x86 package
        uses: Start9Labs/start-technologies/.github/actions/build-s9pk@master
        with:
          target: x86

      - name: Upload package artifact
        uses: Start9Labs/start-technologies/.github/actions/upload-each@master
        with:
          pattern: '*.s9pk'
          retention-days: 14
          compression-level: 0

      - name: Publish rollback package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rollback-upstream-90772a4
          name: Clean upstream rollback 90772a4
          prerelease: true
          files: '*.s9pk'